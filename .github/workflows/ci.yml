name: Predictive Maintenance CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Backend linting + unit tests
  # ──────────────────────────────────────────────────────────────────────────
  backend-test:
    name: Backend – Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'     # Fixed: was python-node (invalid key)

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8 pytest httpx

      - name: Lint – syntax errors and undefined names (hard fail)
        run: |
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Lint – style warnings (soft fail, informational only)
        run: |
          flake8 backend --count --exit-zero --max-line-length=127 --statistics

      - name: Run Pytest unit tests
        env:
          # Point MLflow to a local SQLite file so tests never need a live server
          MLFLOW_TRACKING_URI: sqlite:///mlflow_test.db
        run: |
          python -m pytest tests/ -v --tb=short

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: Frontend dependency install + build verification
  # ──────────────────────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend – Install & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend (Vite production build)
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:8000
        run: npm run build
